<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
    <head th:include="layout :: htmlhead"></head>
    <body>

        
        <main class="container">
            <nav th:replace="layout :: menu">(menu)</nav>
            
            <h1>Cliente</h1>

            <form th:action="@{/clientes}" 
            method="post" 
            th:object="${cliente}"> <!-- timeleaf o back end java irá mandar....-->
                <input type="hidden" th:field="*{id}"> <!-- name e substituido por field, e dps field é trocado por nome-->
                <div class="formgroup">
                    <label for="txtnome">Nome</label>
                    <input type="text" id="txtnome" th:field="*{nome}" class="form-control"> <!-- ou cliente.nome, esse ~e o nome completo, mas como estou no escopo da tag nome, posso 'esconder'-->
                </div>

                <div class="formgroup">
                    <label for="txtendereco">Endereço</label>
                    <input type="text" id="txtendereco" th:field="*{endereco}" class="form-control">
                </div>

                <div class="formgroup">
                    <label for="txtdatanascimento">Data de Vivencia</label>
                    <input type="date" id="txtdatanascimento" th:field="*{dataNascimento}" class="form-control"> <!-- dataNascimento ter que ser exatamente como está na minha entidade-->
                </div>


                <div class="form-group">
                    <button class="btn btn-primary" type="submit">Enviar</button>
                </div>

            </form>

        </main>

        <div th:include="layout :: footer">(footer)</div>
    </body>
</html>
