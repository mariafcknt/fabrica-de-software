<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
    <head th:include="layout :: htmlhead"></head>
    <body>
        
        <main class="container">
            <nav th:replace="layout :: menu">(menu)</nav>

            <h1>Clientes</h1>

            <a href="/clientes/novo" class="btn btn-primary">Novo Cliente</a>

            <table class="table" id="tabclientes">
                <thead>
                    <th>Nome</th>
                    <th>Endereço</th>
                    <th>Data Nascimento</th>
                    <th></th>
                </thead>
                <tbody>
                    <!--th:each é uma for, cada cliente q vem do banco ele repete tudo abaixo -->
                    <tr th:each="umCliente : ${listaClientes}">
                    <td th:text="${umCliente.nome}"></td>
                    <td th:text="${umCliente.endereco}"></td>
                    <td th:text="${umCliente.dataNascimento}"></td>  
                    <!-- @ no timeleaf é uam string-->
                    <td><a th:href="@{'/clientes/alterar/' + ${umCliente.id}}" class="btn btn-warning">Editar</a>
                    
                    <button class="btn btn-danger js-delete" th:data-id="${umCliente.id}">Excluir</button>
                    </td>
                    <!-- js-delete invenção do walter para simplificar-->
                    
                    </tr>
                </tbody>
            </table>

            <div class="modal" tabindex="-1" id="modalcliente">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title">Excluir</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                      <p>Confirma a exclusão do cliente?</p>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
                      <button type="button" class="btn btn-primary" id="btnsim">Sim</button>
                    </div>
                  </div>
                </div>
              </div>

        </main>

        <div th:include="layout :: footer">(footer)</div>
        <script th:src="@{/script.js}"></script>
    </body>
</html>
