<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
    <head th:include="layout :: htmlhead"></head>
    <body>
        <main class="container">
            <nav th:replace="layout :: menu">(menu)</nav>
            <h1>Pet</h1>

            <form th:action="@{/ordens}"
                method="POST"
                th:object="${ordens}">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="txtnome">Nome</label>
                <input type="text"
                    id="txtnome"
                    th:field="*{nome}"
                    class="form-control">
                </div>

                <div class="form-group">
                    <label for="txtraca">Raça</label>
                <input type="text"
                    id="txtraca"
                    th:field="*{raca}"
                    class="form-control">
                </div>

                <div class="formgroup">
                    <label for="txtidade">Idade</label>
                    <input type="text" id="txtidade" th:field="*{idade}" class="form-control">
                </div>

                <div class="form-group">
                    <label for="txtespecie">Espécie</label>
                <input type="text"
                    id="txtespecie"
                    th:field="*{especie}"
                    class="form-control">
                </div>

                <div class="form-group">
                    <label for="txtcliente">Cliente</label>
                    <select class="form-select" th:field="*{cliente}" id="txtcliente">
                        <option th:each="umCliente : ${listaClientes}"
                                th:text="${umCliente.nome}"
                                th:value="${umCliente.id}"
                        ></option>
                    </select>
                </div>

                <div class="form-group">
                    <button class="btn btn-primary" type="submit">Enviar</button>
                </div>
            </form>
        </main>
        <div th:include="layout :: footer">(footer)</div>
    </body>
</html>
